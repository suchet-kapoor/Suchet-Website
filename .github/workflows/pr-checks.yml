name: PR checks

on:
  pull_request:
    branches: [main]

jobs:
  site-checks:
    name: Site health (links + structure)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify no dead links & page sanity
        run: python scripts/check_links.py
